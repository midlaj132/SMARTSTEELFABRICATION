services:
  - type: web
    name: smartsteel-pazhayanur
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 app:app
    healthCheckPath: /healthz
    disk:
      name: smartsteel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: /var/data/welding.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: ADMIN_USERNAME
        value: SMARTSTEEL
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
