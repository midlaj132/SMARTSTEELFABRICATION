{% extends 'base.html' %}
{% block title %}Settings | SMARTSTEELPAZHAYANNUR{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Settings</h2>
        <p class="text-muted mb-0">Administrator controls and storage management</p>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="card p-4">
            <h4 class="mb-3">Update Admin Password</h4>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control mb-3" minlength="6" required>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card p-4">
            <h4 class="mb-3">Backup Data</h4>
            <p class="text-muted">Create a ZIP backup containing the database and uploaded media.</p>
            <form method="post" action="{{ url_for('backup_database') }}">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <button type="submit" class="btn btn-primary">Create Backup</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
