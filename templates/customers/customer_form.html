{% extends 'base.html' %}
{% block title %}{% if customer %}Edit Customer{% else %}Add Customer{% endif %} | SMARTSTEELPAZHAYANNUR{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">{% if customer %}Edit Customer{% else %}Add Customer{% endif %}</h2>
        <p class="text-muted mb-0">Create or update a customer profile</p>
    </div>
</div>

<div class="card p-4">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Customer / Owner Full Name</label>
                <input type="text" name="name" value="{{ customer.name if customer else '' }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Mobile Phone Number</label>
                <input type="text" name="phone" value="{{ customer.phone if customer else '' }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Alternative Phone</label>
                <input type="text" name="alt_phone" value="{{ customer.alt_phone if customer else '' }}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Property Location / Address</label>
                <input type="text" name="location" value="{{ customer.location if customer else '' }}" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label">Notes and Additional Details</label>
                <textarea name="notes" class="form-control" rows="4">{{ customer.notes if customer else '' }}</textarea>
            </div>
            <div class="col-12 d-flex gap-2 justify-content-end pt-3">
                <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Customer</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
